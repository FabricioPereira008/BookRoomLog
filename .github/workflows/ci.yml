name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: 🧪 Testes e cobertura (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11: a dos builds empacotados; 3.14: a usada no desenvolvimento
        python-version: ['3.11', '3.14']
    env:
      PERF_FACTOR: "4"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Dependências do sistema (Qt headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libegl1 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3

      - name: Dependências Python
        run: |
          python -m pip install --upgrade pip
          # Mesmas versões do executável (o PySide 6.12 derruba o processo ao fim dos testes)
          pip install -r requirements-dev.txt -c constraints-build.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Pytest com cobertura mínima
        run: pytest --cov=backend/app --cov=frontend_desktop --cov-report=term-missing --cov-fail-under=85
